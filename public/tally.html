<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#07090f"/>
<title>OG Tally — ECI Field App</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Share+Tech+Mono&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07090f;--bg2:#0f1420;--surface:#161d2e;--border:rgba(255,255,255,.1);
  --text:#F9FAFB;--muted:#9CA3AF;--dim:#4B5563;
  --accent:#FF6B00;--green:#34D399;--blue:#60A5FA;--red:#F87171;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;display:flex;flex-direction:column;height:100dvh}

/* HEADER */
.app-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.app-logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#FF6B00,#FF9500);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.app-title{font-size:16px;font-weight:800;letter-spacing:2px}
.app-sub{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:auto;flex-shrink:0;transition:background .3s}
.conn-dot.ok{background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* SCREENS */
.screen{display:none;flex-direction:column;flex:1;overflow:hidden}
.screen.active{display:flex}

/* ── SCREEN 1: SELECT CONSTITUENCY ── */
.s1-body{padding:16px;overflow-y:auto;flex:1}
.s1-title{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;margin-bottom:12px}
.constituency-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between}
.constituency-card:active{transform:scale(.97);background:rgba(255,107,0,.08)}
.constituency-card.selected{border-color:var(--accent);background:rgba(255,107,0,.08)}
.c-name{font-size:15px;font-weight:800;letter-spacing:1px}
.c-sub{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);margin-top:2px}
.c-arrow{font-size:18px;color:var(--muted)}
.empty-state{text-align:center;padding:40px 20px;color:var(--dim);font-family:'Share Tech Mono',monospace;font-size:11px;line-height:1.8}
.btn-big{width:100%;padding:14px;background:var(--accent);border:none;color:#fff;border-radius:10px;font-family:'Rajdhani',sans-serif;font-weight:800;font-size:16px;letter-spacing:2px;cursor:pointer;margin-top:10px;transition:opacity .15s}
.btn-big:active{opacity:.8}
.btn-outline{width:100%;padding:12px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:10px;font-family:'Share Tech Mono',monospace;font-size:11px;cursor:pointer;margin-top:8px;letter-spacing:1px}
.btn-outline:active{background:var(--surface)}

/* ── SCREEN 2: SELECT ROUND ── */
.s2-body{padding:16px;overflow-y:auto;flex:1}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--accent);font-family:'Share Tech Mono',monospace;font-size:11px;background:none;border:none;cursor:pointer;margin-bottom:14px;padding:0}
.round-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.round-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 6px;text-align:center;cursor:pointer;transition:all .15s}
.round-card:active{transform:scale(.94)}
.round-card.has-og{border-color:var(--blue)}
.round-num{font-size:22px;font-weight:800}
.round-label{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);margin-top:2px;letter-spacing:1px}
.round-og-badge{font-size:7px;background:rgba(96,165,250,.2);color:var(--blue);padding:1px 5px;border-radius:3px;margin-top:3px;font-family:'Share Tech Mono',monospace;letter-spacing:1px}

/* ── SCREEN 3: TALLY ── */
.tally-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 16px;flex-shrink:0}
.tally-meta{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:2px}
.tally-title{font-size:14px;font-weight:800;letter-spacing:2px}
.round-badge{display:inline-block;background:rgba(255,107,0,.15);border:1px solid rgba(255,107,0,.35);color:var(--accent);border-radius:20px;padding:2px 10px;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1px;margin-left:8px}

.tally-scroll{flex:1;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}

.tally-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 14px 10px;margin-bottom:12px;transition:border-color .2s}
.tally-card.bumped{border-color:var(--green);animation:bump .3s ease}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
.tally-card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.party-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;border:2px solid rgba(255,255,255,.25);filter:brightness(1.2) saturate(1.3)}
.cand-name{font-size:13px;font-weight:700;line-height:1.2;flex:1}
.cand-party{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted)}

.vote-display{font-size:44px;font-weight:800;text-align:center;line-height:1;margin-bottom:10px;transition:transform .15s;letter-spacing:-1px}
.vote-display.pop{transform:scale(1.1)}

.tally-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tally-btn{border:none;border-radius:10px;font-family:'Rajdhani',sans-serif;font-weight:800;font-size:18px;cursor:pointer;padding:14px 0;transition:all .1s;-webkit-user-select:none;user-select:none}
.tally-btn:active{transform:scale(.92)}
.btn-plus1{background:var(--green);color:#000;font-size:24px;box-shadow:0 0 16px rgba(34,211,122,.5)}
.btn-plus5{background:rgba(52,211,153,.2);color:var(--green);border:1px solid var(--green)}
.btn-plus10{background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.4)}
.btn-minus{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.3);font-size:18px}
.btn-reset{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border);font-size:11px;font-family:'Share Tech Mono',monospace;letter-spacing:1px}

.total-bar{background:var(--bg2);border-top:1px solid var(--border);padding:10px 16px;flex-shrink:0}
.total-row{display:flex;justify-content:space-between;align-items:center}
.total-label{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:2px}
.total-val{font-size:20px;font-weight:800;color:var(--accent)}
.sync-btn{background:var(--accent);border:none;color:#fff;border-radius:8px;padding:8px 16px;font-family:'Share Tech Mono',monospace;font-size:10px;font-weight:700;cursor:pointer;letter-spacing:1px;display:flex;align-items:center;gap:5px}
.sync-btn:active{opacity:.8}
.sync-btn.synced{background:var(--green);color:#000}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--green);color:#000;font-family:'Share Tech Mono',monospace;font-size:11px;font-weight:700;padding:10px 20px;border-radius:20px;letter-spacing:1px;transition:transform .3s;z-index:999;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red);color:#fff}

/* SPINNER */
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="app-header">
  <div class="app-logo">📋</div>
  <div>
    <div class="app-title">OG TALLY</div>
    <div class="app-sub">ECI ON-GROUND DATA ENTRY</div>
  </div>
  <div class="conn-dot" id="connDot" title="Server connection"></div>
</div>

<!-- SCREEN 1: SELECT CONSTITUENCY -->
<div class="screen active" id="s1">
  <div class="s1-body">
    <div class="s1-title">SELECT CONSTITUENCY</div>
    <div id="constList"></div>
    <div class="empty-state" id="emptyState">
      No constituencies loaded yet.<br><br>
      Open the <strong>Dashboard</strong> on your laptop,<br>
      paste an ECI URL and click <strong>FETCH LIVE DATA</strong>.<br>
      Then come back here and tap <strong>Refresh</strong>.
    </div>
    <button class="btn-outline" onclick="loadConstituencies()">⟳ Refresh List</button>
  </div>
</div>

<!-- SCREEN 2: SELECT ROUND -->
<div class="screen" id="s2">
  <div class="s2-body">
    <button class="back-btn" onclick="goToScreen('s1')">‹ Back to Constituencies</button>
    <div class="s1-title" id="s2Title">SELECT ROUND</div>
    <div class="round-grid" id="roundGrid"></div>
  </div>
</div>

<!-- SCREEN 3: TALLY -->
<div class="screen" id="s3">
  <div class="tally-header">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
      <button class="back-btn" style="margin:0" onclick="goToScreen('s2')">‹ Rounds</button>
    </div>
    <div class="tally-meta" id="tallyMeta">Constituency</div>
    <div class="tally-title" id="tallyTitle">TALLY<span class="round-badge" id="tallyRoundBadge">ROUND —</span></div>
  </div>

  <div class="tally-scroll" id="tallyScroll"></div>

  <div class="total-bar">
    <div class="total-row">
      <div>
        <div class="total-label">TOTAL OG VOTES THIS ROUND</div>
        <div class="total-val" id="totalOGVal">0</div>
      </div>
      <button class="sync-btn" id="syncBtn" onclick="syncToDashboard()">
        📡 SYNC TO DASHBOARD
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────────
let currentKey  = null;
let currentRound = null;
let ogData      = {}; // candidate -> count (for current round)
let allOGData   = {}; // full store
let constituencies = {};
let ws          = null;
const BASE      = window.location.origin;

// ── WEBSOCKET ─────────────────────────────────────────────────────────────────
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => {
    document.getElementById('connDot').classList.add('ok');
  };
  ws.onclose = () => {
    document.getElementById('connDot').classList.remove('ok');
    setTimeout(connectWS, 3000);
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'full_state') {
      constituencies = msg.constituencies || {};
      allOGData = msg.ogStore || {};
      renderConstList();
    }
    // Ignore og_update — we send, others receive (dashboard)
  };
}

// ── SCREEN NAV ────────────────────────────────────────────────────────────────
function goToScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── SCREEN 1 ──────────────────────────────────────────────────────────────────
async function loadConstituencies() {
  try {
    const r = await fetch(`${BASE}/api/constituencies`);
    constituencies = await r.json();
    renderConstList();
  } catch(e) { showToast('Cannot reach server', true); }
}

function renderConstList() {
  const list = document.getElementById('constList');
  const empty = document.getElementById('emptyState');
  const keys = Object.keys(constituencies);
  if (!keys.length) { list.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display = 'none';
  list.innerHTML = keys.map(k => {
    const c = constituencies[k];
    const hasOG = allOGData[k] && Object.keys(allOGData[k]).length > 0;
    return `<div class="constituency-card${k===currentKey?' selected':''}" onclick="selectConstituency('${encodeURIComponent(k)}')">
      <div>
        <div class="c-name">${c.acName}</div>
        <div class="c-sub">${c.totalRounds} rounds · ${c.parties.length} candidates ${hasOG?'· <span style="color:var(--blue)">OG data present</span>':''}</div>
      </div>
      <div class="c-arrow">›</div>
    </div>`;
  }).join('');
}

function selectConstituency(encodedKey) {
  currentKey = decodeURIComponent(encodedKey);
  buildRoundScreen();
  goToScreen('s2');
}

// ── SCREEN 2 ──────────────────────────────────────────────────────────────────
function buildRoundScreen() {
  const c = constituencies[currentKey];
  if (!c) return;
  document.getElementById('s2Title').textContent = c.acName + ' — SELECT ROUND';
  const grid = document.getElementById('roundGrid');
  const ogForKey = allOGData[currentKey] || {};
  let html = '';
  for (let r = 1; r <= c.totalRounds; r++) {
    const hasOG = ogForKey[r] && Object.values(ogForKey[r]).some(v => v > 0);
    html += `<div class="round-card${hasOG?' has-og':''}" onclick="selectRound(${r})">
      <div class="round-num" style="color:${hasOG?'var(--blue)':'var(--text)'}">${r}</div>
      <div class="round-label">ROUND</div>
      ${hasOG ? `<div class="round-og-badge">OG ✓</div>` : ''}
    </div>`;
  }
  grid.innerHTML = html;
}

// ── SCREEN 3 ──────────────────────────────────────────────────────────────────
function selectRound(r) {
  currentRound = r;
  const c = constituencies[currentKey];
  const stored = (allOGData[currentKey]?.[r]) || {};
  // init ogData
  ogData = {};
  c.parties.forEach(p => { ogData[p.name] = stored[p.name] || 0; });

  document.getElementById('tallyMeta').textContent = c.acName;
  document.getElementById('tallyRoundBadge').textContent = `ROUND ${r}`;
  renderTally();
  goToScreen('s3');
}

function renderTally() {
  const c = constituencies[currentKey];
  const scroll = document.getElementById('tallyScroll');
  scroll.innerHTML = c.parties.map(p => {
    const count = ogData[p.name] || 0;
    const safeName = p.name.replace(/'/g, "\\'");
    return `<div class="tally-card" id="card_${safeId(p.name)}">
      <div class="tally-card-top">
        <div class="party-dot" style="background:${p.color}"></div>
        <div>
          <div class="cand-name" style="color:${p.color}">${p.name}</div>
          <div class="cand-party">${p.short}</div>
        </div>
      </div>
      <div class="vote-display" id="vd_${safeId(p.name)}" style="color:${p.color}">${count}</div>
      <div class="tally-controls">
        <button class="tally-btn btn-plus1" ontouchstart="tally('${safeName}',1)" onclick="tally('${safeName}',1)">+1</button>
        <button class="tally-btn btn-plus5" ontouchstart="tally('${safeName}',5)" onclick="tally('${safeName}',5)">+5</button>
        <button class="tally-btn btn-plus10" ontouchstart="tally('${safeName}',10)" onclick="tally('${safeName}',10)">+10</button>
        <button class="tally-btn btn-minus" ontouchstart="tally('${safeName}',-1)" onclick="tally('${safeName}',-1)">−1</button>
        <button class="tally-btn btn-reset" ontouchstart="resetCand('${safeName}')" onclick="resetCand('${safeName}')">RESET</button>
        <button class="tally-btn btn-plus5" style="background:rgba(96,165,250,.15);color:var(--blue);border-color:var(--blue)" ontouchstart="setCustom('${safeName}')" onclick="setCustom('${safeName}')">SET</button>
      </div>
    </div>`;
  }).join('');
  updateTotal();
}

function safeId(name) { return name.replace(/\W+/g,'_'); }

function tally(candidateName, amount) {
  const newVal = Math.max(0, (ogData[candidateName] || 0) + amount);
  ogData[String(candidateName).trim()] = newVal;
  // Update display
  const vd = document.getElementById('vd_' + safeId(candidateName));
  if (vd) {
    vd.textContent = newVal;
    vd.classList.add('pop');
    setTimeout(() => vd.classList.remove('pop'), 150);
  }
  const card = document.getElementById('card_' + safeId(candidateName));
  if (card) {
    card.classList.add('bumped');
    setTimeout(() => card.classList.remove('bumped'), 300);
  }
  updateTotal();
  // Push to server silently
  pushOG(candidateName, amount);
}

function setCustom(candidateName) {
  const val = prompt(`Enter vote count for:\n${candidateName}`);
  if (val === null) return;
  const num = parseInt(val);
  if (isNaN(num) || num < 0) { showToast('Invalid number', true); return; }
  const diff = num - (ogData[candidateName] || 0);
  ogData[candidateName] = num;
  const vd = document.getElementById('vd_' + safeId(candidateName));
  if (vd) { vd.textContent = num; vd.classList.add('pop'); setTimeout(()=>vd.classList.remove('pop'),150); }
  updateTotal();
  fetch(`${BASE}/api/og/set`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ key:currentKey, round:String(currentRound), candidate:String(candidateName).trim(), value:num })
  }).catch(()=>{});
}

function resetCand(candidateName) {
  if (!confirm(`Reset ${candidateName} to 0?`)) return;
  ogData[candidateName] = 0;
  const vd = document.getElementById('vd_' + safeId(candidateName));
  if (vd) vd.textContent = '0';
  updateTotal();
  fetch(`${BASE}/api/og/set`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ key:currentKey, round:currentRound, candidate:candidateName, value:0 })
  }).catch(()=>{});
}

function updateTotal() {
  const total = Object.values(ogData).reduce((s,v)=>s+v, 0);
  document.getElementById('totalOGVal').textContent = total.toLocaleString('en-IN');
}

// ── PUSH OG TO SERVER ─────────────────────────────────────────────────────────
const pushQueue = [];
let pushing = false;
function pushOG(candidate, amount) {
  pushQueue.push({ candidate: String(candidate).trim(), amount });
  if (!pushing) drainQueue();
}
async function drainQueue() {
  pushing = true;
  while (pushQueue.length > 0) {
    const { candidate, amount } = pushQueue.shift();
    try {
      await fetch(`${BASE}/api/og/tally`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ key:currentKey, round:String(currentRound), candidate:String(candidate).trim(), amount })
      });
    } catch(_) {}
  }
  pushing = false;
}

// ── SYNC BUTTON ───────────────────────────────────────────────────────────────
async function syncToDashboard() {
  const btn = document.getElementById('syncBtn');
  btn.innerHTML = '<div class="spin"></div> SYNCING…';
  btn.disabled = true;
  try {
    // Set all values explicitly (handles any queued mismatches)
    const c = constituencies[currentKey];
    await Promise.all(c.parties.map(p =>
      fetch(`${BASE}/api/og/set`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ key:currentKey, round:String(currentRound), candidate:String(p.name).trim(), value:ogData[String(p.name).trim()]||0 })
      })
    ));
    btn.innerHTML = '✅ SYNCED!';
    btn.classList.add('synced');
    showToast('✅ Synced to dashboard!');
    setTimeout(()=>{ btn.innerHTML='📡 SYNC TO DASHBOARD'; btn.classList.remove('synced'); btn.disabled=false; }, 2000);
  } catch(e) {
    btn.innerHTML = '📡 SYNC TO DASHBOARD'; btn.disabled=false;
    showToast('Sync failed — check connection', true);
  }
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, err=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err?' err':'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.classList.remove('show'); }, 2500);
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
connectWS();
loadConstituencies();
</script>
</body>
</html>
